# Flatpak manifest for BooN Transfer.
#
# Strategy: build the .deb with `npm run tauri build` first, then this manifest
# unpacks it into the Flatpak. The GNOME runtime provides webkit2gtk, which the
# Tauri webview needs.
#
# Build:
#   npm run tauri build                       # produces the .deb
#   cp "src-tauri/target/release/bundle/deb/Boon Transfer_1.0.0_amd64.deb" \
#      packaging/flatpak/boon-transfer.deb
#   flatpak-builder --user --install --force-clean \
#      --state-dir "$HOME/.cache/boon-transfer-flatpak" \
#      /tmp/boon-transfer-flatpak-build packaging/flatpak/os.boon.transfer.yml
#
# NOTE: not yet verified with flatpak-builder in this repo — treat runtime
# version and finish-args as a reviewed starting point, confirm on a real build.
id: os.boon.transfer
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: boon-transfer

finish-args:
  # File transfer client: needs the network.
  - --share=network
  - --share=ipc
  # Display.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Secret Service (system keyring) for stored passwords.
  - --talk-name=org.freedesktop.secrets
  # Browse and transfer local files.
  - --filesystem=home
  # Read ~/.ssh (known_hosts, keys) for host-key verification and key auth.
  - --filesystem=~/.ssh

modules:
  - name: boon-transfer
    buildsystem: simple
    build-commands:
      # Unpack the Debian package (ar + tar are in the SDK).
      - ar x boon-transfer.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/boon-transfer /app/bin/boon-transfer
      # Desktop entry + AppStream metadata (canonical copies from packaging/).
      - install -Dm644 os.boon.transfer.desktop /app/share/applications/os.boon.transfer.desktop
      - install -Dm644 os.boon.transfer.metainfo.xml /app/share/metainfo/os.boon.transfer.metainfo.xml
      # Icon (Tauri ships it under the product name; rename to the app id).
      # Install every size the deb carries; normalise a "@2"-style suffix.
      - |
        set -e
        for f in $(find usr/share/icons/hicolor -name '*.png'); do
          size=$(printf '%s' "$f" | sed -E 's#.*/hicolor/([0-9]+x[0-9]+)[^/]*/.*#\1#')
          install -Dm644 "$f" "/app/share/icons/hicolor/$size/apps/os.boon.transfer.png"
        done
    sources:
      - type: file
        path: boon-transfer.deb
      - type: file
        path: ../os.boon.transfer.desktop
      - type: file
        path: ../os.boon.transfer.metainfo.xml
