[package]
name = "linuxscp-client"
version = "0.1.0"
description = "BooN Transfer — dual-pane SFTP/SCP/FTP/FTPS file transfer client"
authors = ["BoondockSulfur"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "linuxscp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit binary name so the installed executable is "boon-transfer"
# (matches the .desktop Exec) regardless of the internal crate name.
[[bin]]
name = "boon-transfer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# SFTP over SSH — pure Rust (no libssh2/OpenSSL). russh-sftp's RawSftpSession
# enables request pipelining for latency-resilient throughput (see
# experiments/russh-spike). async-trait + futures drive the async provider layer.
russh = "0.45"
russh-sftp = "2"
async-trait = "0.1"
futures = "0.3"

# FTP / FTPS — async client with rustls TLS (pure Rust). Plain + FTPS behind one
# provider; transfers bridge suppaftp's futures-IO to tokio via a generic helper
# and tokio_util::compat.
suppaftp = { version = "6", features = ["async-rustls"] }

# WebDAV — HTTP(S) via reqwest (rustls, no OpenSSL) + quick-xml for PROPFIND.
# Both are already in the tree (updater / tauri-utils); declared directly here.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
quick-xml = "0.41"
percent-encoding = "2"

# Secure credential storage via the freedesktop Secret Service. The
# async-secret-service backend is pure Rust (zbus) — no libdbus/libsecret build
# dependency, so bundles stay portable across distros. All keyring calls are made
# from spawn_blocking (its sync facade must not run inside the async runtime).
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[features]
# Default Tauri feature that enables custom protocol on the frontend build.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
strip = true
